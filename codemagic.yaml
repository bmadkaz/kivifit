workflows:
  kivifit-unsigned-ipa:
    name: KiviFit — Unsigned IPA (Sideloadly)
    max_build_duration: 60
    instance_type: mac_mini_m2

    environment:
      xcode: 16.2
      cocoapods: default
      vars:
        APP_NAME: "KiviFit"
        XCODE_WORKSPACE: "KiviFit.xcworkspace"
        XCODE_SCHEME: "KiviFit"
        BUILD_DIR: "build/ios"

    scripts:
      - name: Install CocoaPods dependencies
        script: |
          set -e
          pod install --repo-update
          echo "Workspace created: $(ls -la KiviFit.xcworkspace 2>/dev/null && echo YES || echo NO)"

      - name: Download MediaPipe models
        script: |
          set -e
          mkdir -p KiviFit/Resources
          curl -fL "https://storage.googleapis.com/mediapipe-models/pose_landmarker/pose_landmarker_heavy/float16/latest/pose_landmarker_heavy.task" \
            -o KiviFit/Resources/pose_landmarker_heavy.task
          curl -fL "https://storage.googleapis.com/mediapipe-models/pose_landmarker/pose_landmarker_lite/float16/latest/pose_landmarker_lite.task" \
            -o KiviFit/Resources/pose_landmarker_lite.task
          ls -lh KiviFit/Resources/

      - name: Build unsigned (no code signing)
        script: |
          set -e
          set -o pipefail

          xcodebuild \
            -workspace "$XCODE_WORKSPACE" \
            -scheme "$XCODE_SCHEME" \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath "$BUILD_DIR" \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            ONLY_ACTIVE_ARCH=NO \
            build

      - name: Package unsigned IPA
        script: |
          set -e

          APP_PATH=$(find "$BUILD_DIR/Build/Products/Release-iphoneos" \
            -maxdepth 1 -name "*.app" -type d | head -1)

          if [ -z "$APP_PATH" ]; then
            echo "ERROR: .app not found. Contents of Build/Products:"
            find "$BUILD_DIR/Build/Products" -maxdepth 3 2>/dev/null || true
            exit 1
          fi

          echo "Packaging: $APP_PATH"
          rm -rf Payload
          mkdir Payload
          cp -r "$APP_PATH" Payload/
          zip -qr "${APP_NAME}-unsigned.ipa" Payload/
          rm -rf Payload
          ls -lh "${APP_NAME}-unsigned.ipa"

    artifacts:
      - "*.ipa"
      - "$BUILD_DIR/Logs/**/*.log"

    publishing:
      email:
        recipients:
          - your@email.com
        notify:
          success: true
          failure: true
